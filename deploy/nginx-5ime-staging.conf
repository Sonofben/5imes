# /etc/nginx/sites-available/5ime-staging — the staging copy at staging.5imes.click (DEPLOY.md §14).
# It reuses the request-limit zones that production's /etc/nginx/conf.d/5ime-limits.conf defines,
# and proxies to the staging container on 127.0.0.1:3006.
# Certbot adds the HTTPS (443) block: sudo certbot --nginx -d staging.5imes.click

server {
    listen 80;
    listen [::]:80;
    server_name staging.5imes.click;

    client_max_body_size 5m;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Never in search results, even if a link leaks.
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_conn fivetime_conn 30;
    location ~ /\.(?!well-known) { deny all; return 404; }

    location /api/ {
        limit_req zone=fivetime_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=fivetime_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
