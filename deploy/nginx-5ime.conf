# /etc/nginx/sites-available/5ime
# Replace SERVER_NAME with your host, e.g. 203-0-113-5.sslip.io (demo) or 5ime.ng www.5ime.ng (real domain).
# Certbot adds the HTTPS (443) block automatically: sudo certbot --nginx -d SERVER_NAME

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
