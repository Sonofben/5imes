# /etc/nginx/sites-available/5ime
# Replace SERVER_NAME with your host, e.g. 203-0-113-5.sslip.io (demo) or 5ime.ng www.5ime.ng (real domain).
# Certbot adds the HTTPS (443) block automatically: sudo certbot --nginx -d SERVER_NAME

# Throttle the public payment-return URL (10 requests/minute per IP, small burst).
limit_req_zone $binary_remote_addr zone=fivetime_payverify:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    client_max_body_size 5m;

    # Sign-in cookies (Supabase splits the session into several cookies) plus the security
    # headers are bigger than Nginx's default 4–8 KB header buffer → "502 upstream sent too big header".
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Per-IP request limits (needs /etc/nginx/conf.d/5ime-limits.conf — see DEPLOY.md "Request limits").
    include /etc/nginx/snippets/5ime-limits.conf;

    location = /api/paystack/verify {
        limit_req zone=fivetime_payverify burst=5 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
