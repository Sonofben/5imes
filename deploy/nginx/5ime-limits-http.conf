# 5ime — request limits per visitor IP. Part 1 of 2: goes in the http block.
# Install:  cp deploy/nginx/5ime-limits-http.conf /etc/nginx/conf.d/5ime-limits.conf
#
# Zones (10 MB each holds ~160,000 IP addresses):
#   fivetime_general  pages and server actions     10 requests/second, bursts of 40
#   fivetime_api      /api/* (payments, exports…)   2 requests/second, bursts of 20
#   fivetime_auth     /auth/* (email links, reset) 10 requests/minute, bursts of 10
limit_req_zone $binary_remote_addr zone=fivetime_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fivetime_api:10m     rate=2r/s;
limit_req_zone $binary_remote_addr zone=fivetime_auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=fivetime_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# If the site is ever put behind Cloudflare's proxy (orange cloud), nginx would see
# Cloudflare's addresses instead of visitors'. Then uncomment these lines and add
# Cloudflare's ranges from https://www.cloudflare.com/ips/ :
# real_ip_header CF-Connecting-IP;
# set_real_ip_from 173.245.48.0/20;   # …one line per Cloudflare range
