# 5ime — request limits per visitor IP. Part 2 of 2: goes inside the 5imes.koraforge.com.ng
# server { … } block (the HTTPS one), BEFORE the existing "location / { … }".
# Install:  cp deploy/nginx/5ime-limits-server.conf /etc/nginx/snippets/5ime-limits.conf
#           then add this line inside the server block:   include /etc/nginx/snippets/5ime-limits.conf;
#           nginx -t && systemctl reload nginx
#
# Note: sign-in, sign-up and one-time codes go from the browser straight to Supabase, not
# through this server, so those are limited by Supabase Auth rate limits and the CAPTCHA.

limit_conn fivetime_conn 30;

# Never serve hidden files (.env, .git) even if one ends up in a served folder.
location ~ /\.(?!well-known) { deny all; return 404; }

# Payment provider webhooks: providers call from a few addresses, often in bursts. They
# are verified by signature, so they get a generous limit rather than none.
location ~ ^/api/(paystack|monnify)/webhook$ {
    limit_req zone=fivetime_api burst=100 nodelay;
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    limit_req zone=fivetime_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /auth/ {
    limit_req zone=fivetime_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else (pages, server actions, scripts and styles). A page load fetches about
# 15 files at once, which the burst of 40 allows; sustained floods are cut to 10 a second.
limit_req zone=fivetime_general burst=40 nodelay;
