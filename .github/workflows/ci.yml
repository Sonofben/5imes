name: CI

on:
  push:
  pull_request:

jobs:
  database-tests:
    name: Database rules (migrations 0001-0004 + security tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations and run tests
        working-directory: supabase
        run: |
          args="-f tests/00_supabase_stub.sql"
          for f in migrations/*.sql tests/[1-9]*.sql; do args="$args -f $f"; done
          psql -q -v ON_ERROR_STOP=1 $args

  app:
    name: Lint, unit tests & build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
