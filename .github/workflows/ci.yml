name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database-tests:
    name: Database rules, tenant sweep, generated types
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply every migration, then run every database test (ending with the tenant sweep)
        working-directory: supabase
        run: |
          args="-f tests/00_supabase_stub.sql"
          for f in migrations/*.sql tests/[1-9]*.sql; do args="$args -f $f"; done
          psql -q -v ON_ERROR_STOP=1 $args
      - name: Database types are up to date (run `npm run db:types` after changing the database)
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts
      - name: The app's jsonb schemas match what the database functions really return
        run: |
          mkdir -p supabase/shapes/out
          psql -q -v ON_ERROR_STOP=1 -f supabase/shapes/dump.sql
          node --experimental-strip-types --conditions=react-server --test test/json-shapes.test.mjs

  app:
    name: Lint, types, unit tests, build, smoke tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3311
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: No known vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Prepare the standalone server like the Docker image does
        run: cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (public pages, CSP, headers, signed messages, hidden files)
        run: npx playwright test e2e/public.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    name: No secrets in the code or its history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1
