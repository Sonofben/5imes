<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12141a">
    <title>Can’t connect · 5ime</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182126; background: #f4f3ef; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
      main { width: min(100%, 30rem); padding: clamp(1.25rem, 6vw, 2rem); border: 1px solid #e1e5e2; border-radius: 1.5rem; background: #fff; box-shadow: 0 12px 40px rgb(24 33 38 / 8%); }
      .brand { margin: 0 0 1.5rem; color: #bd4528; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(1.75rem, 8vw, 2.25rem); line-height: 1.08; letter-spacing: -.04em; }
      p { margin: 1rem 0 0; color: #68737a; font-size: .95rem; line-height: 1.65; }
      .note { padding: .75rem 1rem; border-radius: .9rem; background: #fff5e8; color: #80500d; font-size: .85rem; }
      button { min-height: 2.75rem; margin-top: 1.25rem; padding: .7rem 1rem; border: 0; border-radius: .8rem; background: #bd4528; color: #fff; font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #e65b35; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand" id="brand">5ime · Can’t connect</p>
      <h1 id="title">We can’t reach 5ime right now.</h1>
      <p id="detail">Your internet seems to be working, so the problem is on our side or somewhere between you and us. We’re trying again automatically.</p>
      <p class="note">Check-ins are not recorded or saved for later until the connection is back.</p>
      <button type="button" id="retry">Try again</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script>
      (function () {
        var brand = document.getElementById("brand"), title = document.getElementById("title");
        var detail = document.getElementById("detail"), status = document.getElementById("status");
        function show() {
          if (navigator.onLine === false) {
            brand.textContent = "5ime · Offline";
            title.textContent = "You’re offline right now.";
            detail.textContent = "Connect to the internet (Wi‑Fi or mobile data). This page reloads by itself when you’re back online.";
          }
        }
        var waiting = false;
        function check() {
          if (waiting) return;
          waiting = true;
          status.textContent = "Checking…";
          fetch("/api/health", { cache: "no-store" }).then(function (r) {
            if (r.ok) { location.reload(); return; }
            status.textContent = "Still can’t reach 5ime. Trying again in 20 seconds.";
          }).catch(function () {
            status.textContent = navigator.onLine === false ? "" : "Still can’t reach 5ime. Trying again in 20 seconds.";
          }).finally(function () { waiting = false; });
        }
        show();
        document.getElementById("retry").addEventListener("click", check);
        window.addEventListener("online", check);
        window.addEventListener("offline", show);
        setInterval(function () { if (navigator.onLine !== false) check(); }, 20000);
      })();
    </script>
  </body>
</html>
